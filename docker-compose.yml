services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: athenaeum
      POSTGRES_PASSWORD: athenaeum
      POSTGRES_DB: athenaeum
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athenaeum"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/athenaeum
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  grobid:
    image: lfoppiano/grobid:0.8.1
    ports:
      - "8070:8070"

  api:
    build: .
    command: uvicorn athenaeum.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+asyncpg://athenaeum:athenaeum@postgres:5432/athenaeum
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: athenaeum
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-secret-change-me
      ORCID_REDIRECT_URI: http://localhost:8000/auth/orcid/callback
      ORCID_API_BASE: https://sandbox.orcid.org
      GROBID_URL: http://grobid:8070
      UNPAYWALL_EMAIL: contact@athenaeum.app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
      redis:
        condition: service_started
      grobid:
        condition: service_started
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations

  worker:
    build: .
    command: arq athenaeum.worker.settings.WorkerSettings
    environment:
      DATABASE_URL: postgresql+asyncpg://athenaeum:athenaeum@postgres:5432/athenaeum
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: athenaeum
      REDIS_URL: redis://redis:6379/0
      GROBID_URL: http://grobid:8070
      UNPAYWALL_EMAIL: contact@athenaeum.app
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
      redis:
        condition: service_started
      grobid:
        condition: service_started
    volumes:
      - ./src:/app/src
      - model-cache:/root/.cache/huggingface

volumes:
  postgres-data:
  neo4j-data:
  redis-data:
  model-cache:
