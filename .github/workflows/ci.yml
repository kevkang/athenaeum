name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # pgvector/pgvector, not stock postgres: retrieve/hybrid.py's vector
      # search needs the `vector` extension, and this is the same image
      # docker-compose.yml already uses for local dev — same schema
      # behavior in CI as on a contributor's machine, no drift.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: athenaeum
          POSTGRES_PASSWORD: athenaeum
          POSTGRES_DB: athenaeum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U athenaeum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # test_graph_sync.py exercises graph/sync.py against a real instance —
      # same image docker-compose.yml uses for local dev.
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/athenaeum
        ports:
          - 7687:7687
        options: >-
          --health-cmd "wget -q -O - http://localhost:7474 || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://athenaeum:athenaeum@localhost:5432/athenaeum
      NEO4J_URL: bolt://localhost:7687
      NEO4J_PASSWORD: athenaeum
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Apply migrations
        run: alembic upgrade head

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src

      - name: Test
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --quiet

      - name: Type check
        run: ./node_modules/.bin/tsc -b

      - name: Lint
        run: npx eslint .

      - name: Build
        run: npm run build
