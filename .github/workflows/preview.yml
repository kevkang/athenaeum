name: Preview Deploy

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: |
          npm ci --quiet
          VITE_API_URL=https://api.athenaindex.app npm run build

      - name: Deploy to EC2
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > /tmp/preview_key
          chmod 600 /tmp/preview_key
          ssh -i /tmp/preview_key -o StrictHostKeyChecking=no \
            "$EC2_USER@$EC2_HOST" \
            "mkdir -p /opt/athenaeum/previews/pr-$PR_NUM"
          rsync -az --delete \
            -e "ssh -i /tmp/preview_key -o StrictHostKeyChecking=no" \
            web/dist/ \
            "$EC2_USER@$EC2_HOST:/opt/athenaeum/previews/pr-$PR_NUM/"

      - name: Post preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const prNum = context.payload.pull_request.number;
            const marker = '<!-- preview-deploy -->';
            const body = `${marker}\n**Preview:** https://pr-${prNum}.athenaindex.app`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNum,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNum,
                body,
              });
            }

  teardown:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Remove preview from EC2
        uses: appleboy/ssh-action@v1
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: PR_NUM
          script: rm -rf /opt/athenaeum/previews/pr-$PR_NUM
