server {
    listen 80;
    server_name ~^pr-\d+\.athenaindex\.app$;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ~^pr-(?<pr>\d+)\.athenaindex\.app$;

    ssl_certificate     /etc/letsencrypt/live/athenaindex.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/athenaindex.app/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    root /usr/share/nginx/previews/pr-$pr;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite's hashed asset filenames change on every content change, so it's
    # safe to cache them forever — but index.html itself (which references
    # those hashes) must always be revalidated, or a browser can keep
    # serving a stale build indefinitely after a new deploy since nginx's
    # defaults here send no explicit Cache-Control at all.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

server {
    listen 80;
    server_name athenaindex.app www.athenaindex.app api.athenaindex.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name athenaindex.app www.athenaindex.app;

    ssl_certificate     /etc/letsencrypt/live/athenaindex.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/athenaindex.app/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # See the matching comment in the PR-preview server block above — same
    # reasoning, same fix.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

server {
    listen 443 ssl http2;
    server_name api.athenaindex.app;

    ssl_certificate     /etc/letsencrypt/live/athenaindex.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/athenaindex.app/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    client_max_body_size 50M;

    # zotero.sqlite carries Zotero's full-text search index (extracted PDF
    # text) alongside its metadata, so a real research library's file can run
    # well past the 50M cap that's sized for paper uploads — this matches the
    # app-side _SQLITE_MAX_BYTES cap in api/zotero_local.py. Without this, a
    # request over 50M gets rejected by nginx before reaching the app, so it
    # never picks up CORS headers — the browser reports that as a generic
    # network error rather than a real 413.
    location /zotero-local/browser-import/ {
        client_max_body_size 500M;
        proxy_pass         http://api:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass         http://api:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
