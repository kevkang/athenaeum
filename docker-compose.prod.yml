# Production overrides — use with:
#   docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  api:
    command: uvicorn athenaeum.main:app --host 0.0.0.0 --port 8000 --workers 2
    environment:
      # Trips the startup guard in main.py if JWT_SECRET is ever left at its
      # dev default here — see _reject_insecure_defaults.
      ENVIRONMENT: production
      JWT_SECRET: ${JWT_SECRET}
      ORCID_CLIENT_ID: ${ORCID_CLIENT_ID}
      ORCID_CLIENT_SECRET: ${ORCID_CLIENT_SECRET}
      ORCID_REDIRECT_URI: ${ORCID_REDIRECT_URI}
      ORCID_API_BASE: ${ORCID_API_BASE}
      FRONTEND_URL: ${FRONTEND_URL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      S3_BUCKET: ${S3_BUCKET}
      AWS_REGION: ${AWS_REGION}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      # Base docker-compose.yml hardcodes these for local MinIO — unset them
      # here so boto3 falls through to the EC2 instance's IAM role and hits
      # real AWS S3 instead of a nonexistent/empty local minio container.
      S3_ENDPOINT_URL:
      AWS_ACCESS_KEY_ID:
      AWS_SECRET_ACCESS_KEY:

  neo4j:
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}

  # Production stores files in real AWS S3 (see S3_ENDPOINT_URL above), so it
  # has no use for MinIO, but the base file makes api and worker wait on
  # minio-init. MinIO's images can no longer be pulled from Docker Hub
  # without a login (a deploy failed on exactly that, 2026-09-28), so here
  # both are no-op stand-ins from an image that can: one idles and reports
  # healthy, the other exits successfully at once. Nothing talks to them.
  minio:
    image: alpine:3
    command: ["sleep", "infinity"]
    healthcheck:
      test: ["CMD", "true"]

  minio-init:
    image: alpine:3
    entrypoint: ["true"]

  worker:
    environment:
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      S3_BUCKET: ${S3_BUCKET}
      AWS_REGION: ${AWS_REGION}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY}
      S3_ENDPOINT_URL:
      AWS_ACCESS_KEY_ID:
      AWS_SECRET_ACCESS_KEY:

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        VITE_API_URL: https://api.athenaindex.app
        # Passed through from the host shell (deploy.sh exports it after
        # `git pull`, since the build container itself has no `.git`).
        VITE_GIT_SHA: ${VITE_GIT_SHA:-unknown}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot
      - /opt/athenaeum/previews:/usr/share/nginx/previews:ro
    depends_on:
      - api
    restart: always

volumes:
  certbot-webroot:
