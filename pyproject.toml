[project]
name = "athenaeum"
version = "0.0.1"
description = "Research traceability tool for working scientists"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "structlog>=24.4",
    "python-multipart>=0.0.12",
    # Phase 1 — ingestion
    "pyalex>=0.16",
    "pysbd>=0.3.4",
    "sentence-transformers>=3.0",
    "arq>=0.26",
    "lxml>=5.0",
    # Phase 3 — synthesis
    "anthropic>=0.40",
    "redis>=5.0",
    # Phase 5 — graph
    "neo4j>=5.0",
    # Phase 6 — archive
    "ruamel.yaml>=0.18",
    # S3 uploads
    "boto3>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.7",
    "mypy>=1.13",
]

# Later phases will add: neo4j, ruamel.yaml, anthropic, openai

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/athenaeum"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
